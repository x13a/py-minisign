[project]
name = "py-minisign"
version = "0.21.0"
authors = [
  { name = "Frank Denis", email = "github@pureftpd.org" },
  { name = "lucky", email = "x13a@pm.me" },
]
description = "Python minisign library"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.0",
  "typing-extensions>=4.0.0",
]
license = "ISC"
license-files = ["LICEN[CS]E*"]

keywords = [
    "cryptography",
    "signature",
    "ed25519",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
homepage = "https://github.com/x13a/py-minisign"
source = "https://github.com/x13a/py-minisign"
issues = "https://github.com/x13a/py-minisign/issues"
funding = "https://x13a.github.io/donate/"

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "minisign"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
