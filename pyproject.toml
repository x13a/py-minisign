[project]
name = "py-minisign"
version = "0.13.4"
authors = [
  { name = "Frank Denis" },
  { name = "lucky" },
]
description = "Python minisign library"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.0",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
homepage = "https://github.com/x13a/py-minisign"
source = "https://github.com/x13a/py-minisign"
issues = "https://github.com/x13a/py-minisign/issues"

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "minisign"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
